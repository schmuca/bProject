name: Poll Allegiant ADS-B

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ADS-B collector
        env:
          ADSB_LOL_API_KEY: ${{ secrets.ADSB_LOL_API_KEY }}
        run: python collector.py

      - name: Commit and push new pings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --staged --quiet; then
            echo "No new telemetry to commit."
            exit 0
          fi
          git commit -m "chore(data): log Allegiant pings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
